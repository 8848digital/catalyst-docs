name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time. Queued runs wait rather than cancelling, so a
# deploy in flight is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose — pnpm/action-setup reads the pinned
      # `packageManager` field from package.json. Specifying both can conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Dependency build scripts are pre-approved via `allowBuilds` in
      # pnpm-workspace.yaml, so this does not stall on an interactive prompt.
      - run: pnpm install --frozen-lockfile

      # onBrokenLinks is 'throw', so a dead internal link fails the deploy here.
      - run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
